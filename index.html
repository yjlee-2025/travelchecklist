<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>여행 체크리스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap">

<style>
  /* Layout: two-tab single-page checklist, large touch targets for seniors */
  :root {
    --bg: #F7F9FC;
    --surface: #FFFFFF;
    --fg: #1A1F2E;
    --fg-muted: #5A6375;
    --accent: #2A7FD4;
    --accent-light: #E8F2FC;
    --green: #1D9E6F;
    --green-light: #E6F7F2;
    --border: #D8DFE8;
    --check-bg: #2A7FD4;
    --tab-active-bg: #2A7FD4;
    --tab-active-fg: #FFFFFF;
    --tab-inactive-bg: #EDF1F7;
    --tab-inactive-fg: #5A6375;
    --shadow: 0 2px 12px rgba(42,127,212,0.10);
    --progress-track: #D8DFE8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131720;
      --surface: #1E2535;
      --fg: #E8EDF5;
      --fg-muted: #8A96AA;
      --accent: #5BA4E8;
      --accent-light: #1A2840;
      --green: #34C991;
      --green-light: #112B22;
      --border: #2E3A4E;
      --check-bg: #5BA4E8;
      --tab-active-bg: #5BA4E8;
      --tab-active-fg: #131720;
      --tab-inactive-bg: #1E2535;
      --tab-inactive-fg: #8A96AA;
      --shadow: 0 2px 12px rgba(0,0,0,0.35);
      --progress-track: #2E3A4E;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #131720;
    --surface: #1E2535;
    --fg: #E8EDF5;
    --fg-muted: #8A96AA;
    --accent: #5BA4E8;
    --accent-light: #1A2840;
    --green: #34C991;
    --green-light: #112B22;
    --border: #2E3A4E;
    --check-bg: #5BA4E8;
    --tab-active-bg: #5BA4E8;
    --tab-active-fg: #131720;
    --tab-inactive-bg: #1E2535;
    --tab-inactive-fg: #8A96AA;
    --shadow: 0 2px 12px rgba(0,0,0,0.35);
    --progress-track: #2E3A4E;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
    font-size: 18px;
    line-height: 1.5;
    min-height: 100%;
    padding-inline: 0;
    padding-block: 0;
  }

  .app-wrap {
    max-width: 680px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 24px;
  }

  /* Header */
  .app-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .app-title {
    font-size: 28px;
    font-weight: 900;
    color: var(--fg);
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  .app-subtitle {
    font-size: 16px;
    color: var(--fg-muted);
  }
  .plane-icon {
    display: inline-block;
    font-size: 32px;
    margin-bottom: 8px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .tab-btn {
    flex: 1;
    padding: 14px 8px;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, box-shadow 0.2s;
    background: var(--tab-inactive-bg);
    color: var(--tab-inactive-fg);
    line-height: 1.3;
  }
  .tab-btn.active {
    background: var(--tab-active-bg);
    color: var(--tab-active-fg);
    box-shadow: var(--shadow);
  }
  .tab-btn:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  /* Progress */
  .progress-area {
    background: var(--surface);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .progress-text {
    font-size: 16px;
    color: var(--fg-muted);
    white-space: nowrap;
    min-width: 80px;
  }
  .progress-bar-wrap {
    flex: 1;
    height: 12px;
    background: var(--progress-track);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
  }
  .progress-count {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
    min-width: 48px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* Section */
  .section-label {
    font-size: 14px;
    font-weight: 700;
    color: var(--fg-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 20px 0 10px;
    padding-left: 4px;
  }

  /* Checklist */
  .checklist {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 8px;
  }

  .check-item {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border-radius: 16px;
    padding: 16px 18px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.15s;
    box-shadow: var(--shadow);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .check-item:hover {
    border-color: var(--accent);
  }
  .check-item:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .check-item.done {
    background: var(--green-light);
    border-color: var(--green);
  }

  .check-box {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 2.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--bg);
    transition: background 0.2s, border-color 0.2s;
  }
  .check-item.done .check-box {
    background: var(--green);
    border-color: var(--green);
  }
  .check-mark {
    display: none;
    font-size: 18px;
    color: #fff;
    font-weight: 900;
    line-height: 1;
  }
  .check-item.done .check-mark {
    display: block;
  }

  .check-content {
    flex: 1;
    min-width: 0;
  }
  .check-name {
    font-size: 20px;
    font-weight: 600;
    color: var(--fg);
    transition: color 0.2s;
  }
  .check-item.done .check-name {
    color: var(--green);
    text-decoration: line-through;
    text-decoration-color: var(--green);
  }
  .check-note {
    font-size: 15px;
    color: var(--fg-muted);
    margin-top: 2px;
  }

  /* Done banner */
  .done-banner {
    background: var(--green-light);
    border: 2px solid var(--green);
    color: var(--green);
    border-radius: 16px;
    padding: 18px 20px;
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    margin-top: 16px;
    display: none;
  }
  .done-banner.show { display: block; }

  /* Add item area */
  .add-item-area {
    margin-top: 20px;
    background: var(--surface);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .add-item-label {
    font-size: 15px;
    font-weight: 700;
    color: var(--fg-muted);
    margin-bottom: 10px;
  }
  .add-item-row {
    display: flex;
    gap: 10px;
  }
  .add-item-input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-family: inherit;
    font-size: 18px;
    background: var(--bg);
    color: var(--fg);
    transition: border-color 0.2s;
  }
  .add-item-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .add-item-input::placeholder { color: var(--fg-muted); }
  .add-item-btn {
    padding: 12px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.2s;
  }
  .add-item-btn:hover { opacity: 0.85; }
  .add-item-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Reset button */
  .reset-btn {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    background: #E8420F;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .reset-btn:hover { opacity: 0.85; }
  .reset-btn:focus-visible {
    outline: 3px solid #E8420F;
    outline-offset: 2px;
  }

  /* Panel visibility */
  .panel { display: none; }
  .panel.active { display: block; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="app-wrap">
  <div class="app-header">
    <div class="plane-icon">✈️</div>
    <h1 class="app-title">여행 준비 체크리스트</h1>
    <p class="app-subtitle">항목을 눌러서 완료 표시하세요</p>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab-btn active" onclick="switchTab('items')" role="tab" aria-selected="true" id="tab-items">
      🧳 여행 준비물
    </button>
    <button class="tab-btn" onclick="switchTab('home')" role="tab" aria-selected="false" id="tab-home">
      🏠 집안 확인
    </button>
  </div>

  <!-- 여행 준비물 패널 -->
  <div class="panel active" id="panel-items">
    <div class="progress-area">
      <span class="progress-text">준비 완료</span>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="bar-items" style="width:0%"></div>
      </div>
      <span class="progress-count" id="count-items">0 / 0</span>
    </div>

    <div class="section-label">📋 서류 &amp; 결제</div>
    <div class="checklist" id="list-items-doc"></div>

    <div class="section-label">💊 건강 &amp; 안전</div>
    <div class="checklist" id="list-items-health"></div>

    <div class="section-label">📱 전자기기</div>
    <div class="checklist" id="list-items-tech"></div>

    <div class="section-label">👕 의류 &amp; 생활용품</div>
    <div class="checklist" id="list-items-clothes"></div>

    <div class="add-item-area">
      <div class="add-item-label">➕ 나만의 항목 추가</div>
      <div class="checklist" id="list-custom-items" style="margin-bottom:10px"></div>
      <div class="add-item-row">
        <input class="add-item-input" id="input-items" type="text" placeholder="추가할 항목 입력..." maxlength="40"
          onkeydown="if(event.key==='Enter') addCustomItem('items')">
        <button class="add-item-btn" onclick="addCustomItem('items')">추가</button>
      </div>
    </div>
    <div class="done-banner" id="done-items">🎉 준비 완료! 즐거운 여행 되세요!</div>
    <button class="reset-btn" onclick="resetPanel('items')">↺ 처음부터 다시</button>
  </div>

  <!-- 집안 확인 패널 -->
  <div class="panel" id="panel-home">
    <div class="progress-area">
      <span class="progress-text">확인 완료</span>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="bar-home" style="width:0%"></div>
      </div>
      <span class="progress-count" id="count-home">0 / 0</span>
    </div>

    <div class="section-label">🔥 가스 &amp; 전기</div>
    <div class="checklist" id="list-home-utilities"></div>

    <div class="section-label">🔒 보안 &amp; 안전</div>
    <div class="checklist" id="list-home-security"></div>

    <div class="section-label">🌱 기타 확인</div>
    <div class="checklist" id="list-home-misc"></div>

    <div class="add-item-area">
      <div class="add-item-label">➕ 나만의 항목 추가</div>
      <div class="checklist" id="list-custom-home" style="margin-bottom:10px"></div>
      <div class="add-item-row">
        <input class="add-item-input" id="input-home" type="text" placeholder="추가할 항목 입력..." maxlength="40"
          onkeydown="if(event.key==='Enter') addCustomItem('home')">
        <button class="add-item-btn" onclick="addCustomItem('home')">추가</button>
      </div>
    </div>
    <div class="done-banner" id="done-home">✅ 집안 확인 완료! 안심하고 출발하세요!</div>
    <button class="reset-btn" onclick="resetPanel('home')">↺ 처음부터 다시</button>
  </div>
</div>

<script>
const DATA = {
  items: {
    doc: [
      { name: "여권 또는 신분증", note: "여권은 유효기간 6개월 이상 남았는지 확인" },
      { name: "항공권 / 기차표 / 버스표", note: "출력본 또는 앱 저장 확인" },
      { name: "숙소 예약 확인서", note: "체크인 시간과 주소 메모해 두기" },
      { name: "신용카드 / 체크카드", note: "해외 결제 가능 여부 확인" },
      { name: "현금 (비상용)", note: "소액 현금은 따로 분산 보관" },
      { name: "여행자 보험 증서", note: "보험사 긴급 연락처 저장" },
    ],
    health: [
      { name: "상비약", note: "두통약, 소화제, 반창고, 지사제" },
      { name: "처방약 (복용 중인 약)", note: "여행 기간보다 여유 있게 챙기기" },
      { name: "마스크", note: "여분 포함 충분하게 준비" },
      { name: "손 소독제 / 물티슈", note: "작은 휴대용 사이즈" },
      { name: "비상 연락처 메모", note: "가족, 숙소, 보험사 번호" },
    ],
    tech: [
      { name: "휴대폰 충전기", note: "해외여행이면 멀티 어댑터도 준비" },
      { name: "보조배터리", note: "기내 반입만 가능 — 위탁 수하물 불가" },
    ],
    clothes: [
      { name: "여벌 옷", note: "날씨에 맞는 옷 준비" },
      { name: "편한 신발", note: "많이 걷는 여행이면 특히 중요" },
      { name: "우산 / 우비", note: "간이 우산 하나면 충분" },
      { name: "선글라스 / 모자", note: "햇볕 강한 곳은 필수" },
      { name: "세면도구", note: "치약, 칫솔, 샴푸, 폼클렌징 등" },
      { name: "슬리퍼 (실내용)", note: "숙소 및 장거리 이동 시 편리" },
    ],
  },
  home: {
    utilities: [
      { name: "가스 밸브 잠금", note: "가스레인지 확인" },
      { name: "수도꼭지 잠금", note: "부엌, 욕실 모두 확인" },
      { name: "콘센트 확인", note: "TV, 전기장판, 스탠드 등 대기전력 차단" },
      { name: "난방 전원 확인", note: "외출 모드가 아닌 완전 차단" },
      { name: "월패드·스마트홈 외출 설정 확인", note: "외출 모드 설정 후 잠금 여부 확인" },
    ],
    security: [
      { name: "현관문 이중 잠금", note: "도어락 번호 외에 추가 잠금 확인" },
      { name: "모든 창문 잠금", note: "방, 화장실 창문 하나씩 확인" },
      { name: "귀중품 안전 보관", note: "통장, 도장, 귀금속 등 서랍에 잠금" },
    ],
    misc: [
      { name: "냉장고 정리", note: "상할 수 있는 음식 처리 또는 지인 부탁" },
      { name: "쓰레기 버리기", note: "음식물 쓰레기 특히 주의" },
      { name: "화분 물 주기", note: "긴 여행이면 지인 부탁" },
      { name: "우편물 처리", note: "믿을 수 있는 지인에게 수거 부탁" },
      { name: "반려동물 맡기기", note: "펫호텔 또는 지인에게 미리 부탁" },
      { name: "지인에게 비상 연락처 전달", note: "연락 방법 미리 공유" },
    ],
  }
};

// Custom items added by the user
const custom = { items: [], home: [] };

// State: checked items per panel
const state = {
  items: {},
  home: {}
};

// Build checklists
function buildAll() {
  buildSection('items', 'doc', 'list-items-doc');
  buildSection('items', 'health', 'list-items-health');
  buildSection('items', 'tech', 'list-items-tech');
  buildSection('items', 'clothes', 'list-items-clothes');
  buildSection('home', 'utilities', 'list-home-utilities');
  buildSection('home', 'security', 'list-home-security');
  buildSection('home', 'misc', 'list-home-misc');
  buildCustomSection('items');
  buildCustomSection('home');
  updateProgress('items');
  updateProgress('home');
}

function buildCustomSection(panel) {
  let container = document.getElementById('list-custom-' + panel);
  if (!container) return;
  container.innerHTML = '';
  custom[panel].forEach((item, i) => {
    const key = 'custom_' + i;
    const div = document.createElement('div');
    div.className = 'check-item' + (state[panel][key] ? ' done' : '');
    div.setAttribute('tabindex', '0');
    div.setAttribute('role', 'checkbox');
    div.setAttribute('aria-checked', state[panel][key] ? 'true' : 'false');
    div.setAttribute('aria-label', item.name);
    div.innerHTML = `
      <div class="check-box"><span class="check-mark">✓</span></div>
      <div class="check-content">
        <div class="check-name">${item.name}</div>
      </div>
    `;
    div.addEventListener('click', () => toggleCustom(panel, i, key, div));
    div.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleCustom(panel, i, key, div); }
    });
    container.appendChild(div);
  });
}

function toggleCustom(panel, i, key, el) {
  state[panel][key] = !state[panel][key];
  el.classList.toggle('done', state[panel][key]);
  el.setAttribute('aria-checked', state[panel][key] ? 'true' : 'false');
  updateProgress(panel);
}

function addCustomItem(panel) {
  const input = document.getElementById('input-' + panel);
  const name = input.value.trim();
  if (!name) return;
  custom[panel].push({ name });
  input.value = '';
  buildCustomSection(panel);
  updateProgress(panel);
  // Scroll to newly added item
  const container = document.getElementById('list-custom-' + panel);
  if (container && container.lastChild) container.lastChild.focus();
}

function buildSection(panel, section, containerId) {
  const container = document.getElementById(containerId);
  const items = DATA[panel][section];
  container.innerHTML = '';
  items.forEach((item, i) => {
    const key = section + '_' + i;
    const div = document.createElement('div');
    div.className = 'check-item' + (state[panel][key] ? ' done' : '');
    div.setAttribute('tabindex', '0');
    div.setAttribute('role', 'checkbox');
    div.setAttribute('aria-checked', state[panel][key] ? 'true' : 'false');
    div.setAttribute('aria-label', item.name);
    div.innerHTML = `
      <div class="check-box">
        <span class="check-mark">✓</span>
      </div>
      <div class="check-content">
        <div class="check-name">${item.name}</div>
        ${item.note ? `<div class="check-note">${item.note}</div>` : ''}
      </div>
    `;
    div.addEventListener('click', () => toggle(panel, section, i, key, div));
    div.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        toggle(panel, section, i, key, div);
      }
    });
    container.appendChild(div);
  });
}

function toggle(panel, section, i, key, el) {
  state[panel][key] = !state[panel][key];
  el.classList.toggle('done', state[panel][key]);
  el.setAttribute('aria-checked', state[panel][key] ? 'true' : 'false');
  updateProgress(panel);
}

function countTotal(panel) {
  return Object.values(DATA[panel]).reduce((s, arr) => s + arr.length, 0) + custom[panel].length;
}

function countDone(panel) {
  return Object.values(state[panel]).filter(Boolean).length;
}

function updateProgress(panel) {
  const total = countTotal(panel);
  const done = countDone(panel);
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('bar-' + panel).style.width = pct + '%';
  document.getElementById('count-' + panel).textContent = done + ' / ' + total;
  const banner = document.getElementById('done-' + panel);
  if (done === total && total > 0) {
    banner.classList.add('show');
  } else {
    banner.classList.remove('show');
  }
}

function resetPanel(panel) {
  state[panel] = {};
  custom[panel] = [];
  buildAll();
}

function switchTab(panel) {
  ['items', 'home'].forEach(p => {
    document.getElementById('panel-' + p).classList.toggle('active', p === panel);
    const btn = document.getElementById('tab-' + p);
    btn.classList.toggle('active', p === panel);
    btn.setAttribute('aria-selected', p === panel ? 'true' : 'false');
  });
}

buildAll();
</script>

</body></html>
